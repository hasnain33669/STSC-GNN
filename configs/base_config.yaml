# Base configuration for STSC-GNN

model:
  node_input_dim: 30
  esm_dim: 640
  hidden_dim: 384
  output_dim: 3
  num_gnn_layers: 5
  dropout: 0.1

training:
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-2
  epochs: 100
  plasticity_weight: 0.3
  huber_delta: 1.0
  gradient_clip: 1.0

data:
  k_hop: 2
  bio_threshold: 0.5
  cache_embeddings: true

evaluation:
  tolerance: 0.10
  metrics: ['mae', 'rmse', 'accuracy']

paths:
  data_dir: ./data
  output_dir: ./results
  cache_dir: ./cache
  saved_models: ./saved_models
